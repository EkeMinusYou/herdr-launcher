version: 2

builds:
  - binary: launcher
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.releaseVersion={{ .Version }}

# Plain binaries named like launcher_darwin_arm64 and launcher_windows_amd64.exe, as the fetch scripts expect.
archives:
  - formats: [binary]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: SHA256SUMS

changelog:
  use: github-native
