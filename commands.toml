# ランチャーに出すコマンド。起動のたびに読み込むので、書き換えればビルドし直さずに反映される
#
# name        一覧に出す名前 (絞り込みの対象)
# description 一覧とプレビューに出す説明
# command     ランチャーを開いたときの cwd で sh -c に渡して実行する
# pane        command の代わりに、このプラグインの [[panes]] の id を popup で開く

[[commands]]
name = "lazygit"
description = "lazygit を開く"
pane = "lazygit"

[[commands]]
name = "neovim"
description = "nvim を開く"
pane = "nvim"

[[commands]]
name = "gh browse"
description = "リポジトリをブラウザで開く"
command = "gh browse"

[[commands]]
name = "gh pr view --web"
description = "今のブランチの PR をブラウザで開く"
command = "gh pr view --web"
