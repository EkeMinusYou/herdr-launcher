# herdr launcher config.
#
# Copy this file to the plugin config directory to customize it:
#   cp default_config.toml "$(herdr plugin config-dir ekeminusyou.launcher)/config.toml"
# It is read every time the launcher opens, so edits apply without a rebuild.

# Color theme: "catppuccin" (herdr's default theme) or "ansi" (your terminal's 16 colors).
theme = "catppuccin"

# Override individual theme colors with #rrggbb or a terminal color number ("4").
# Keys: fg, subtle, dim, faint, selection_bg, cursor_fg, accent, caret,
#       green, yellow, red, orange, blue
# [colors]
# accent = "#89b4fa"

# Commands shown in the launcher.
#   name        shown in the list and used for search
#   description shown next to the name and in the preview
#   command     run with `sh -c` in the directory of the pane you opened the launcher from
#   pane        instead of command, open one of this plugin's [[panes]] by id in a popup

[[commands]]
name = "lazygit"
description = "Open lazygit"
pane = "lazygit"

[[commands]]
name = "neovim"
description = "Open nvim"
pane = "nvim"

[[commands]]
name = "gh browse"
description = "Open the repository in the browser"
command = "gh browse"

[[commands]]
name = "gh pr view --web"
description = "Open the pull request for the current branch in the browser"
command = "gh pr view --web"
