# herdr launcher config.
#
# Copy this file to the plugin config directory to customize it:
#   cp default_config.toml "$(herdr plugin config-dir ekeminusyou.launcher)/config.toml"
# It is read every time the launcher opens, so edits apply without a rebuild.
# Anything config.toml leaves out keeps the default here: the theme and each profile field.
# There are no default commands; the ones below are examples. Unknown keys are errors.

# Color theme: "catppuccin" (herdr's default theme) or "ansi" (your terminal's 16 colors).
theme = "catppuccin"

# Override individual theme colors with #rrggbb or a terminal color number ("4").
# Keys: bg, fg, subtle, dim, faint, selection_bg, cursor_fg, accent, caret,
#       green, mauve, teal, yellow, red, orange, blue
# bg is the background of the whole launcher (catppuccin paints it a step darker than herdr's so the
# popup stands out); bg = "none" leaves the terminal's background.
# [colors]
# accent = "#89b4fa"

# Profiles decide what a launcher lists and how it starts. The plugin's launcher and goto panes use
# the profile of the same name; open a pane with --env LAUNCHER_PROFILE=<name> to use another one.
# A profile here only needs the fields it changes; the rest come from the default profile of that name,
# or for a new profile from start = "select", sources = ["commands", "panes"], cursor = "top", sort = "herdr".
#   start    "select" (move with j/k, / to search) or "search" (type right away)
#   sources  what to list: "commands", "panes"
#   cursor   "top" or "current" (the pane you opened it from)
#   sort     order when not searching: "herdr", "name" or "frecency"

[profiles.launcher]
start = "select"
sources = ["commands", "panes"]
cursor = "top"
sort = "frecency"

[profiles.goto]
start = "select"
sources = ["panes"]
cursor = "current"
sort = "herdr"

# Commands shown in the launcher. None by default; uncomment or write your own.
#   name        shown in the list and used for search
#   description shown next to the name and in the preview
#   command     run with `sh -c` (`cmd /c` on Windows) in the directory of the pane you opened the launcher from,
#               with its output shown in the preview while the launcher stays open
#   interactive with command, run it in the launcher's terminal instead (for commands like htop);
#               the launcher closes when it exits
#   close       with command, close the launcher when it succeeds; on failure it stays open to show the output
#   plugin, pane  instead of command, open a plugin pane: the plugin id and the id of one of its [[panes]]

