name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: bash -n scripts/fetch-launcher.sh
        if: runner.os != 'Windows'
      # Builds from source through the script, which also checks that it parses.
      - run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/fetch-launcher.ps1
        if: runner.os == 'Windows'
        env:
          LAUNCHER_FROM_SOURCE: "1"
