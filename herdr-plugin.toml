# A telescope-like picker for running frequent commands and jumping to panes.
# lazygit opens as a plugin pane because keys.command popups are always titled "popup".
id = "ekeminusyou.launcher"
name = "Launcher"
version = "0.2.1"
min_herdr_version = "0.9.0"
description = "Pick and run tools and commands, or jump to panes, in a telescope-like picker."
platforms = ["macos", "linux"]

# herdr plugin install fetches the prebuilt bin/launcher for this version from GitHub Releases.
# plugin link does not build, so run go build -o bin/launcher . once by hand after linking.
[[build]]
command = ["bash", "scripts/fetch-launcher.sh"]
platforms = ["macos", "linux"]

# Bind keys to these actions. plugin pane open without --cwd starts in the plugin directory,
# so bin/launcher resolves as a relative path. The launcher then moves to the cwd of the pane it was opened from.
[[actions]]
id = "open"
title = "Open launcher"
contexts = ["workspace", "tab", "pane", "global"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "ekeminusyou.launcher", "--entrypoint", "launcher", "--focus"]

[[actions]]
id = "goto"
title = "Go to pane"
contexts = ["workspace", "tab", "pane", "global"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "ekeminusyou.launcher", "--entrypoint", "goto", "--focus"]

# Each pane uses the profile of the same name from $(herdr plugin config-dir ekeminusyou.launcher)/config.toml,
# or another one picked with --env LAUNCHER_PROFILE=<name> (see default_config.toml). Colors and commands come from there too.
# A bin/launcher built from source rebuilds itself when a source file is newer than the binary.
[[panes]]
id = "launcher"
title = "launcher"
placement = "popup"
width = "70%"
height = "70%"
command = ["bin/launcher"]

# A replacement for herdr's goto (prefix+g) that lists only panes.
[[panes]]
id = "goto"
title = "goto"
placement = "popup"
width = "70%"
height = "70%"
command = ["bin/launcher"]

[[panes]]
id = "lazygit"
title = "lazygit"
placement = "popup"
width = "100%"
height = "100%"
command = ["lazygit"]
