# A telescope-like picker for running frequent commands and jumping to panes.
id = "ekeminusyou.launcher"
name = "Launcher"
version = "0.9.0"
min_herdr_version = "0.9.0"
description = "Pick and run tools and commands, or jump to panes and workspaces, in a telescope-like picker."
platforms = ["macos", "linux", "windows"]

# herdr plugin install fetches the prebuilt bin/launcher.exe for this version from GitHub Releases.
# The .exe suffix is required on Windows and an ordinary file name elsewhere, so one command works everywhere.
# plugin link does not build, so run go build -o bin/launcher.exe . once by hand after linking.
[[build]]
command = ["bash", "scripts/fetch-launcher.sh"]
platforms = ["macos", "linux"]

[[build]]
command = ["powershell.exe", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/fetch-launcher.ps1"]
platforms = ["windows"]

# Bind keys to these actions. They run from the plugin directory and open the pane of the same name
# at the width and height of its profile in config.toml (launcher.exe open). The launcher then moves to
# the cwd of the pane it was opened from.
[[actions]]
id = "open"
title = "Open launcher"
contexts = ["workspace", "tab", "pane", "global"]
command = ["./bin/launcher.exe", "open", "launcher"]

[[actions]]
id = "goto"
title = "Go to pane"
contexts = ["workspace", "tab", "pane", "global"]
command = ["./bin/launcher.exe", "open", "goto"]

[[actions]]
id = "goto-workspace"
title = "Go to workspace"
contexts = ["workspace", "tab", "pane", "global"]
command = ["./bin/launcher.exe", "open", "goto-workspace"]

# Each pane uses the profile of the same name from $(herdr plugin config-dir ekeminusyou.launcher)/config.toml,
# or another one picked with --env LAUNCHER_PROFILE=<name> (see default_config.toml). Colors and commands come from there too.
# A launcher built from source rebuilds itself (except on Windows) when a source file is newer than the binary.
[[panes]]
id = "launcher"
title = "launcher"
placement = "popup"
width = "70%"
height = "70%"
command = ["./bin/launcher.exe"]

# A replacement for herdr's goto (prefix+g) that lists only panes.
[[panes]]
id = "goto"
title = "goto"
placement = "popup"
width = "70%"
height = "70%"
command = ["./bin/launcher.exe"]

# A workspace picker that preserves each workspace's active tab and focused pane.
[[panes]]
id = "goto-workspace"
title = "goto workspace"
placement = "popup"
width = "70%"
height = "70%"
command = ["./bin/launcher.exe"]
